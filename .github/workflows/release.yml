name: Release

# Si avvia spingendo un tag vX.Y: compila il jar, lo prova sull'esempio e crea la release con il jar allegato.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compila
        run: mvn -B -q package
      - name: Prova sull'esempio
        run: java -jar target/odin-doc.jar genera esempio/esempio.properties --output=target/esempio.pdf
      - name: Crea la release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > note.md <<'NOTE'
          Scarica `odin-doc.jar` (serve Java 11 o superiore) e lancia:

          ```
          java -jar odin-doc.jar genera    cliente.properties
          java -jar odin-doc.jar pacchetto cliente.properties
          java -jar odin-doc.jar conferma  cliente.properties
          ```

          Istruzioni complete nel README.
          NOTE
          gh release create "${GITHUB_REF_NAME}" target/odin-doc.jar --title "OdinDoc ${GITHUB_REF_NAME#v}" --notes-file note.md
