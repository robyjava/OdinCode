name: Release

# Si avvia quando si pubblica una release (anche dal telefono, con un tag nuovo vX.Y)
# oppure spingendo un tag vX.Y: compila il jar, lo prova sull'esempio e lo allega alla release.
on:
  release:
    types: [published]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compila
        run: mvn -B -q package
      - name: Prova sull'esempio
        run: java -jar target/odin-doc.jar genera esempio/esempio.properties --output=target/esempio.pdf
      - name: Crea la release o allega il jar
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > note.md <<'NOTE'
          Scarica `odin-doc.jar` (serve Java 11 o superiore) e lancia:

          ```
          java -jar odin-doc.jar genera    cliente.properties
          java -jar odin-doc.jar pacchetto cliente.properties
          java -jar odin-doc.jar conferma  cliente.properties
          ```

          Istruzioni complete nel README.
          NOTE
          TAG="${{ github.event.release.tag_name || github.ref_name }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" target/odin-doc.jar --clobber
          else
            gh release create "$TAG" target/odin-doc.jar --title "OdinDoc ${TAG#v}" --notes-file note.md
          fi
