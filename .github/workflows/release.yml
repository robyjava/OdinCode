name: Release

# Quando si pubblica una release su GitHub, compila il jar e lo allega alla release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compila
        run: mvn -B -q package
      - name: Prova sull'esempio
        run: java -jar target/odin-doc.jar genera esempio/esempio.properties --output=target/esempio.pdf
      - name: Allega il jar alla release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" target/odin-doc.jar --clobber
