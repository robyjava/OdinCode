# ===============================================================
#  OdinDoc - ESEMPIO 2: DDL, sorgenti e lettura dei DATI dal database
#  La struttura arriva SEMPRE dalle DDL: il database serve solo a leggere
#  righe, colonne vuote, valori dei flag e tabelle di decodifica.
#
#  Uso:  java -jar odin-doc.jar genera configurazioni/02-con-database.properties
# ===============================================================

titolo=Gestione Vendite
cliente=ACME S.p.A.

ddl=C:/clienti/acme/db
src=C:/clienti/acme/progetto/src/main/java
descrizioni=C:/clienti/acme/documentazione/descrizioni
# nascono ACME-manuale-utente.pdf e ACME-manuale-programmatore.pdf
output=C:/clienti/acme/documentazione/ACME-manuale.pdf
pacchetto=C:/clienti/acme/documentazione/da-descrivere.md

# --- database (sola lettura) ---
# Formato: jdbc:oracle:thin:@//SERVER:PORTA/SERVIZIO  (oppure @SERVER:PORTA:SID per i vecchi SID)
db.url=jdbc:oracle:thin:@//oracle-test.acme.local:1521/ACMETEST
# Meglio un utente di sola lettura, su un ambiente di test o una copia
db.utente=LETTORE_DOC
# La password NON scriverla qui: se manca la chiede all'avvio,
# oppure imposta la variabile d'ambiente ODINDOC_DB_PASSWORD
#db.password=

# Il jar del driver Oracle (ojdbc8.jar per Java 8+, ojdbc11.jar per Java 11+)
db.driver.jar=C:/drivers/ojdbc11.jar

# Tabelle con più righe di così: solo il conteggio, niente analisi delle colonne
db.soglia.righe=2000000
# Tabelle da non leggere (dati personali, sanitari, ecc.), separate da virgola
db.escludi=ANAGRAFICA_PERSONE,DOCUMENTI_IDENTITA
# Secondi massimi per ogni query
db.timeout=60

# Per un giro veloce senza database basta mettere true, senza toccare il resto
db.salta=false
