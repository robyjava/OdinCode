# ===============================================================
#  OdinDoc - ESEMPIO 3: applicazione divisa in più progetti/moduli
#  Più cartelle si separano con il punto e virgola ;
#
#  Uso:  java -jar odin-doc.jar genera configurazioni/03-piu-moduli.properties
# ===============================================================

titolo=Portale Ordini
cliente=ACME S.p.A.

# DDL sparse in più cartelle (schema principale + script di migrazione)
ddl=C:/clienti/acme/db/schema;C:/clienti/acme/db/migrazioni

# Sorgenti di più moduli
src=C:/clienti/acme/ordini-core/src/main/java;C:/clienti/acme/ordini-web/src/main/java;C:/clienti/acme/ordini-batch/src/main/java

descrizioni=C:/clienti/acme/documentazione/descrizioni
output=C:/clienti/acme/documentazione/Portale-Ordini.pdf

# Pagine web di più moduli
web=C:/clienti/acme/ordini-web/src/main/webapp
pacchetto=C:/clienti/acme/documentazione/da-descrivere.md

# Il pacchetto per l'AI a rate: massimo 30 elementi per volta
pacchetto.max=30

# Di solito i test si escludono; metti true se contengono SQL utile da documentare
includi.test=false
