# ===============================================================
#  OdinDoc - ESEMPIO 1: solo DDL e sorgenti, nessun database
#  Il modo consigliato per il primo giro su un cliente.
#
#  Uso:  java -jar odin-doc.jar genera configurazioni/01-solo-codice.properties
#
#  Percorsi: su Windows usa la barra / (C:/clienti/...) oppure la doppia \\
# ===============================================================

titolo=Gestione Vendite
cliente=ACME S.p.A.

# Cartella con gli script DDL (.sql .ddl .tab .vw .trg .pks .pkb ...), anche con sottocartelle
ddl=C:/clienti/acme/db

# Cartella con i sorgenti Java
src=C:/clienti/acme/progetto/src/main/java

# Dove tenere le descrizioni (la crea da solo al primo pacchetto)
descrizioni=C:/clienti/acme/documentazione/descrizioni

# File prodotti
output=C:/clienti/acme/documentazione/ACME-documentazione.pdf
pacchetto=C:/clienti/acme/documentazione/da-descrivere.md
